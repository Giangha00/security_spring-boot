spring:
  application:
    name: auth
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema do Flyway quản lý
  thymeleaf:
    cache: false # dev; bật lại trên production

server:
  port: 8088
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

app:
  security:
    totp-encryption-key: ${TOTP_AES_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    base-url: ${APP_BASE_URL:http://localhost:8088}
    hsts-enabled: false
  mail:
    smtp-enabled: ${SMTP_ENABLED:false}
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    from: no-reply@fptaptech.edu.vn
