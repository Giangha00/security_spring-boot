<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Đặt mật khẩu mới')}"></head>

<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <h1 class="h3 mb-4 text-center"
                    th:text="${inviteMode} ? 'Thiết lập mật khẩu tài khoản' : 'Đặt lại mật khẩu'">Đặt lại mật khẩu</h1>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="${inviteMode} ? @{/invite/accept} : @{/password/reset}" method="post"
                    class="card card-body">
                    <input type="hidden" name="token" th:value="${token}">
                    <div class="mb-3">
                        <label for="password" class="form-label">Mật khẩu mới (tối thiểu 12 ký tự)</label>
                        <input id="password" name="password" type="password" class="form-control"
                            autocomplete="new-password" required>
                    </div>
                    <div class="mb-3">
                        <label for="passwordConfirm" class="form-label">Nhập lại mật khẩu mới</label>
                        <input id="passwordConfirm" name="passwordConfirm" type="password" class="form-control"
                            autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Lưu mật khẩu</button>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
