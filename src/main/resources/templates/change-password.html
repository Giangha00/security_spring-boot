<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Đổi mật khẩu')}"></head>

<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <h1 class="h3 mb-4 text-center">Đổi mật khẩu</h1>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

                <form th:action="@{/password/change}" method="post" class="card card-body">
                    <div class="mb-3">
                        <label for="currentPassword" class="form-label">Mật khẩu hiện tại</label>
                        <input id="currentPassword" name="currentPassword" type="password" class="form-control"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">Mật khẩu mới (tối thiểu 12 ký tự)</label>
                        <input id="newPassword" name="newPassword" type="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="passwordConfirm" class="form-label">Nhập lại mật khẩu mới</label>
                        <input id="passwordConfirm" name="passwordConfirm" type="password" class="form-control"
                            required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Cập nhật mật khẩu</button>
                </form>

                <p class="text-center mt-3"><a th:href="@{/}">Về trang chủ</a></p>
            </div>
        </div>
    </main>
</body>

</html>
