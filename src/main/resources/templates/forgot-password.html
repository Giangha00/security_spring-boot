<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Quên mật khẩu')}"></head>

<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <h1 class="h3 mb-4 text-center">Quên mật khẩu</h1>

                <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/password/forgot}" method="post" class="card card-body">
                    <div class="mb-3">
                        <label for="email" class="form-label">Địa chỉ Email</label>
                        <input id="email" name="email" type="email" class="form-control" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Gửi link đặt lại mật khẩu</button>
                </form>

                <p class="text-center mt-3"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
            </div>
        </div>
    </main>
</body>

</html>
