<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Nhật ký kiểm toán')}"></head>

<body class="bg-light">
    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Nhật ký kiểm toán (Audit Logs)</h1>
            <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Quay lại Quản trị tài khoản</a>
        </div>

        <form th:action="@{/admin/audit-logs}" method="get" class="row g-2 mb-4">
            <div class="col-md-4">
                <select name="eventType" class="form-select">
                    <option value="">-- Tất cả sự kiện --</option>
                    <option th:each="et : ${eventTypes}" th:value="${et}" th:text="${et}"
                        th:selected="${et == selectedEventType}"></option>
                </select>
            </div>
            <div class="col-md-5">
                <input name="username" class="form-control" placeholder="Tìm theo tài khoản thực hiện hoặc đối tượng..."
                    th:value="${username}">
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100">Lọc nhật ký</button>
            </div>
        </form>

        <div class="card card-body">
            <table class="table table-striped align-middle mb-0">
                <thead>
                    <tr>
                        <th>Thời điểm</th>
                        <th>Sự kiện</th>
                        <th>Tài khoản</th>
                        <th>Đối tượng</th>
                        <th>IP</th>
                        <th>User-Agent</th>
                        <th>Chi tiết</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log : ${logPage.content}">
                        <td th:text="${log.createdAt}"></td>
                        <td><span class="badge bg-dark" th:text="${log.eventType}"></span></td>
                        <td th:text="${log.username}"></td>
                        <td th:text="${log.target}"></td>
                        <td th:text="${log.ipAddress}"></td>
                        <td class="small text-truncate" th:text="${log.userAgent}"></td>
                        <td th:text="${log.details}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
